let lang=localStorage.getItem('parallel-lang') || ((navigator.language||'').startsWith('ru') ? 'ru' : 'en');
let state={screen:'home',mode:'friend',host:'',guest:'',questions:[],hostAnswers:[],guestAnswers:[],question:0,role:'host'};
const app=document.getElementById('app');
const t=k=>COPY[lang][k];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qById=id=>[...QUESTIONS.couple,...QUESTIONS.friend].find(q=>q.id===id);
const qLabel=(id,index)=>qById(id)?.[lang][index]||'';
function setScreen(s){state.screen=s;window.scrollTo({top:0,behavior:'instant'});render()}
function buildUrl(key,payload){const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set(key,encode(payload));return url.toString()}
function encode(data){const binary=unescape(encodeURIComponent(JSON.stringify(data)));return btoa(binary).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
function decode(input){const base=input.replaceAll('-','+').replaceAll('_','/');return JSON.parse(decodeURIComponent(escape(atob(base+'='.repeat((4-base.length%4)%4))))) }
function portable(){return location.protocol==='https:'||location.protocol==='http:'}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast(t('inviteClipboard'))}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('inviteClipboard'))}catch(e){toast(t('inviteFail'))}ta.remove()}}
function packet(){return{v:1,mode:state.mode,host:state.host,guest:state.guest,qs:state.questions,ha:state.hostAnswers}}
function resultPacket(){return{...packet(),ga:state.guestAnswers}}
function validPacket(p,requireGuest=false){return p&&p.v===1&&['friend','couple'].includes(p.mode)&&typeof p.host==='string'&&p.host.length<=50&&typeof p.guest==='string'&&p.guest.length<=50&&Array.isArray(p.qs)&&p.qs.length===5&&p.qs.every(id=>qById(id)&&id[0]===p.mode[0])&&new Set(p.qs).size===5&&Array.isArray(p.ha)&&p.ha.length===5&&p.ha.every(x=>x===0||x===1)&&(!requireGuest||(Array.isArray(p.ga)&&p.ga.length===5&&p.ga.every(x=>x===0||x===1)))}
function home(){return `<div class="screen center"><div class="eyebrow"><span>🪐</span>${t('tag')}</div><h1>${t('hero1')}<br><span class="grad">${t('hero2')}</span></h1><p class="sub">${t('intro')}</p><button class="btn primary" id="start">${t('start')} <span>↗</span></button><div class="pills"><span class="pill">♡ ${t('couple')}</span><span class="pill">✳ ${t('friend')}</span><span class="pill">✦ ${t('together')}</span></div><div class="hero-stage" aria-hidden="true"><div class="orbit"></div><div class="float-card one"><span class="avatar">🧸</span><div><b>${t('heroA')}</b><small>02:17 AM · 09:17 PM</small></div></div><div class="float-card two"><span class="avatar">💌</span><div><b>${t('heroB')}</b><small>5/5 completed ✨</small></div></div><div class="float-card three"><span>💜</span> ${t('heroC')}</div></div><p class="legal">${t('privacy')}</p></div>`}
function choose(){return `<div class="screen"><section class="panel"><button class="mini-back" id="back">← ${t('back')}</button><p class="step">01 / 03 · ${t('modeTag')}</p><h2>${t('choose')}</h2><p class="muted">${t('chooseSub')}</p><div class="choice-grid"><button type="button" class="choice ${state.mode==='couple'?'active':''}" data-mode="couple"><span class="icon">💗</span><b>${t('couple')}</b><small>${t('coupleSub')}</small></button><button type="button" class="choice ${state.mode==='friend'?'active':''}" data-mode="friend"><span class="icon">🫶</span><b>${t('friend')}</b><small>${t('friendSub')}</small></button></div><label class="label" for="name1">${t('yname')}</label><input class="field" maxlength="24" id="name1" autocomplete="nickname" placeholder="${t('placeholder1')}" value="${esc(state.host)}"/><label class="label" for="name2">${t('pname')}</label><input class="field" maxlength="24" id="name2" placeholder="${t('placeholder2')}" value="${esc(state.guest)}"/><div class="actions"><button class="btn primary full" id="to-questions">${t('next')} <span>↗</span></button></div></section></div>`}
function question(){const id=state.questions[state.question],q=qById(id),selected=(state.role==='host'?state.hostAnswers:state.guestAnswers)[state.question];return `<div class="screen"><section class="panel"><button class="mini-back" id="back-q">← ${t('back')}</button><p class="step">${state.role==='host'?'02':'✉'} / 03 · ${state.role==='host'?esc(state.host):esc(state.guest)}</p><div class="question-index">${t('answered')} ${state.question+1} ${t('of')} 5</div><div class="progress">${state.questions.map((_,i)=>`<i class="${i<=state.question?'done':''}"></i>`).join('')}</div><span class="prompt-emoji">${q.emoji}</span><h2 class="question-title">${esc(qLabel(id,0))}</h2><div class="answers">${[0,1].map(a=>`<button type="button" class="answer ${selected===a?'selected':''}" data-answer="${a}"><span>${esc(qLabel(id,a+1))}</span><span class="circle">${selected===a?'✓':''}</span></button>`).join('')}</div><p class="instructions">${state.role==='host'?t('qsub'):t('qsubGuest')}</p><div class="actions"><button class="btn primary full" id="next-q" ${selected===undefined?'disabled':''}>${state.question===4?t('last'):t('continue')} ↗</button></div></section></div>`}
function invite(){const url=buildUrl('p',packet());return `<div class="screen"><section class="panel center"><div class="eyebrow">✉ ${t('sent')}</div><div class="locked"><div class="big">💌</div><h2 style="margin-bottom:12px">${t('inviteTitle')}</h2><p>${t('inviteSub')}</p></div><div class="urlbox"><code>${esc(url)}</code><button id="copy-invite">${lang==='ru'?'Копировать':'Copy'}</button></div><button class="btn primary full" id="copy-big">${t('inviteCopy')} ↗</button><div class="share-actions"><button class="btn secondary small" id="preview-guest">${t('preview')}</button></div><p class="instructions">${t('after')}</p>${!portable()?`<p class="tip">⚠ ${t('localWarning')}</p>`:''}<p class="legal">${t('inviteInstructions')} ${t('urlNote')}</p></section></div>`}
function invited(){return `<div class="screen"><section class="panel center"><div class="eyebrow">✉ PARALLEL</div><div class="locked"><div class="big">💜</div><h2 style="margin-bottom:10px">${t('guestTitle')}</h2><p>${esc(state.host)} → ${esc(state.guest||t('yourPerson'))}</p></div><p class="muted">${t('guestSub')}</p><label class="label" for="guest-name">${t('noName')}</label><input class="field" id="guest-name" maxlength="24" value="${esc(state.guest)}" placeholder="${t('placeholder1')}"/><button class="btn primary full" id="begin-guest" style="margin-top:20px">${t('guestButton')} ↗</button><p class="legal">${t('urlNote')}</p></section></div>`}
function result(){const matches=state.hostAnswers.filter((x,i)=>x===state.guestAnswers[i]).length;const score=matches*20;let title=matches>=4?t('revealTitle'):matches<=1?t('revealLow'):t('revealMid');const url=buildUrl('r',resultPacket());const mission=MISSIONS[lang][state.mode][Math.floor(Date.now()/86400000)%3];return `<div class="screen"><section class="panel wide"><div class="result-hero"><div class="eyebrow">✦ ${t('revealTag')}</div><h2 style="margin:20px 0 9px">${esc(state.host)} <span class="names">×</span> ${esc(state.guest)}</h2><div class="score-ring" style="--score:${score}%"><div><strong>${score}%</strong><small>IN SYNC</small></div></div><h2>${title}</h2><p class="muted">${matches} / 5 ${lang==='ru'?'совпадений':'matching answers'} · ${state.mode==='friend'?'🫶':'💗'}</p></div><h3 style="font-size:21px;margin:25px 0 0">${t('compare')}</h3><div class="result-list">${state.questions.map((id,i)=>`<div class="result-row"><div class="question">${qById(id).emoji} ${esc(qLabel(id,0))}</div><div class="compare"><div><small>${esc(state.host)}</small>${esc(qLabel(id,state.hostAnswers[i]+1))}</div><div><small>${esc(state.guest)}</small>${esc(qLabel(id,state.guestAnswers[i]+1))}</div></div><div class="match">${state.hostAnswers[i]===state.guestAnswers[i]?t('match'):t('different')}</div></div>`).join('')}</div><div class="daily"><b>✳ ${t('todays')}</b><p>${esc(mission)}</p></div><div class="share-actions"><button class="btn primary" id="copy-result">${t('share')} ↗</button><button class="btn secondary" id="save-result">${t('download')} ↓</button></div><p class="instructions center">${t('guestDone')}</p><div class="center" style="margin-top:26px"><button class="mini-back" id="restart">↺ ${t('restart')}</button></div><p class="legal">${t('urlNote')}</p></section></div>`}
function render(){document.documentElement.lang=lang;document.querySelector('.nav-button').textContent='✦ '+t('nav');app.innerHTML=({home,choose,question,invite,invited,result}[state.screen]||home)();wire()}
function wire(){const $=id=>document.getElementById(id);if($('start'))$('start').onclick=()=>setScreen('choose');if($('back'))$('back').onclick=()=>setScreen('home');document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{state.mode=el.dataset.mode;state.host=$('name1')?.value.trim()||'';state.guest=$('name2')?.value.trim()||'';render()});if($('to-questions'))$('to-questions').onclick=()=>{state.host=$('name1').value.trim().slice(0,24)|| (lang==='ru'?'Я':'Me');state.guest=$('name2').value.trim().slice(0,24)|| (lang==='ru'?'Мой человек':'My person');state.questions=QUESTIONS[state.mode].map(q=>q.id).sort(()=>Math.random()-.5).slice(0,5);state.hostAnswers=[];state.guestAnswers=[];state.question=0;state.role='host';setScreen('question')};if($('back-q'))$('back-q').onclick=()=>{if(state.question>0){state.question--;render()}else if(state.role==='host')setScreen('choose');else setScreen('invited')};document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{(state.role==='host'?state.hostAnswers:state.guestAnswers)[state.question]=Number(el.dataset.answer);render()});if($('next-q'))$('next-q').onclick=()=>{const answers=state.role==='host'?state.hostAnswers:state.guestAnswers;if(answers[state.question]===undefined)return;if(state.question<4){state.question++;render()}else setScreen(state.role==='host'?'invite':'result')};if($('copy-invite'))$('copy-invite').onclick=()=>copy(buildUrl('p',packet()));if($('copy-big'))$('copy-big').onclick=()=>copy(buildUrl('p',packet()));if($('preview-guest'))$('preview-guest').onclick=()=>{state.role='guest';state.question=0;state.guestAnswers=[];setScreen('invited')};if($('begin-guest'))$('begin-guest').onclick=()=>{state.guest=$('guest-name').value.trim().slice(0,24)||state.guest||t('yourPerson');state.role='guest';state.question=0;setScreen('question')};if($('copy-result'))$('copy-result').onclick=()=>copy(buildUrl('r',resultPacket()));if($('save-result'))$('save-result').onclick=saveCard;if($('restart'))$('restart').onclick=reset}
function reset(){history.replaceState({},'',location.pathname);state={screen:'home',mode:'friend',host:'',guest:'',questions:[],hostAnswers:[],guestAnswers:[],question:0,role:'host'};render()}
function saveCard(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const c=canvas.getContext('2d');const grad=c.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#fbf1ff');grad.addColorStop(1,'#ffe7f0');c.fillStyle=grad;c.fillRect(0,0,1080,1350);c.fillStyle='#e4d6ff';c.beginPath();c.arc(130,220,260,0,Math.PI*2);c.fill();c.fillStyle='#f8c4dc';c.beginPath();c.arc(960,1140,330,0,Math.PI*2);c.fill();c.fillStyle='#fff';roundRect(c,80,170,920,990,55);c.fill();c.fillStyle='#795fcb';c.font='bold 36px Arial';c.textAlign='center';c.fillText('✦ P A R A L L E L',540,300);c.fillStyle='#2b2543';c.font='bold 70px Arial';const names=state.host+' × '+state.guest;let size=70;while(c.measureText(names).width>840&&size>28){size-=3;c.font='bold '+size+'px Arial'}c.fillText(names,540,445);const matches=state.hostAnswers.filter((x,i)=>x===state.guestAnswers[i]).length;c.fillStyle='#8663e9';c.font='bold 192px Arial';c.fillText(String(matches*20)+'%',540,730);c.fillStyle='#867a9e';c.font='bold 35px Arial';c.fillText('IN SYNC',540,795);c.font='31px Arial';c.fillText(matches+'/5 MATCHING ANSWERS',540,855);c.fillStyle='#ed80a8';c.font='bold 38px Arial';c.fillText(state.mode==='friend'?'BESTIES FOREVER 🫶':'TWO HEARTS, ONE UNIVERSE',540,1015);c.fillStyle='#9788b0';c.font='25px Arial';c.fillText('parallel · our little universe',540,1115);const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download='parallel-result.png';document.body.appendChild(link);link.click();link.remove()}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
document.getElementById('lang-toggle').onclick=()=>{lang=lang==='ru'?'en':'ru';localStorage.setItem('parallel-lang',lang);render()};document.getElementById('home-button').onclick=reset;
try{const params=new URLSearchParams(location.search);const data=params.has('r')?decode(params.get('r')):params.has('p')?decode(params.get('p')):null;if(data){const res=params.has('r');if(!validPacket(data,res))throw Error('Invalid invitation');state={...state,mode:data.mode,host:data.host,guest:data.guest,questions:data.qs,hostAnswers:data.ha,guestAnswers:res?data.ga:[],role:'guest',screen:res?'result':'invited'};}}catch(e){state.screen='home';setTimeout(()=>toast(t('oops')),500)}
render();
</script>
</body>
</html>
